<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Finder App</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0f0f0f;
      color: #ffffff;
    }

    header {
      padding: 20px;
      text-align: center;
      background-color: #121212;
    }

    header h1 {
      color: #2e7d5b;
      margin: 0;
    }

    .container {
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .section {
      margin-bottom: 40px;
    }

    .card {
      background-color: #1c1c1c;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .card img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .button {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 25px;
      background-color: #2e7d5b;
      color: white;
      text-decoration: none;
      margin-top: 10px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #121212;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

<header>
  <h1>Bank Finder</h1>
  <p>Finde den perfekten Spot zum Entspannen</p>
</header>

<div class="container">

  <div class="section card">
    <h2>Karte entdecken</h2>
    <img src="map-placeholder.jpg" alt="Karte">
    <p>Sieh dir alle verfügbaren Bänke in deiner Umgebung an und entdecke neue Orte.</p>
  </div>

  <div class="section features">
    <div class="card">
      <h3>Favoriten</h3>
      <p>Speichere deine Lieblingsbänke und greife jederzeit darauf zu.</p>
    </div>

</html>
